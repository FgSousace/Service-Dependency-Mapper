name: Windows Installer

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "packaging/**"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/windows-installer.yml"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-installer:
    name: Build Windows setup
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install -e ".[dev]" pyinstaller

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Read package version
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          "SDMAP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "Installer version: $version"

      - name: Build desktop application
        run: python -m PyInstaller --noconfirm --clean packaging\ServiceDependencyMapper.spec

      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler was not found at $iscc"
          }
          & $iscc packaging\ServiceDependencyMapper.iss

      - name: Verify installer
        shell: pwsh
        run: |
          $setup = Get-ChildItem "dist\installer\Service-Dependency-Mapper-Setup-*.exe" | Select-Object -First 1
          if (-not $setup) { throw "Installer was not created." }
          if ($setup.Length -lt 1000000) { throw "Installer is unexpectedly small." }
          Get-FileHash $setup.FullName -Algorithm SHA256

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Service-Dependency-Mapper-Setup-${{ env.SDMAP_VERSION }}
          path: dist/installer/Service-Dependency-Mapper-Setup-*.exe
          if-no-files-found: error

      - name: Publish tagged release asset
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $setup = Get-ChildItem "dist\installer\Service-Dependency-Mapper-Setup-*.exe" | Select-Object -First 1
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "Service Dependency Mapper $tag" --generate-notes
          }
          gh release upload $tag $setup.FullName --clobber
