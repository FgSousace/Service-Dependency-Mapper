<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Service Dependency Mapper desktop GUI</title>
  <desc id="desc">Dark desktop interface with an update button, infrastructure discovery, service status cards, component results, and diagnosis details.</desc>
  <defs>
    <linearGradient id="window" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#091824"/>
    </linearGradient>
    <linearGradient id="run" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#020617" flood-opacity=".55"/>
    </filter>
  </defs>

  <rect width="1400" height="820" rx="26" fill="#020914"/>
  <g filter="url(#shadow)">
    <rect x="38" y="30" width="1324" height="760" rx="18" fill="url(#window)" stroke="#1e3a4a" stroke-width="2"/>
  </g>
  <rect x="38" y="30" width="1324" height="42" rx="18" fill="#0d1d2b"/>
  <circle cx="68" cy="51" r="6" fill="#fb7185"/>
  <circle cx="89" cy="51" r="6" fill="#fbbf24"/>
  <circle cx="110" cy="51" r="6" fill="#34d399"/>
  <text x="700" y="57" fill="#93a9b8" font-family="Segoe UI, Arial" font-size="14" text-anchor="middle">Service Dependency Mapper 1.3.0</text>

  <g font-family="Segoe UI, Arial">
    <rect x="72" y="98" width="44" height="44" rx="6" fill="none" stroke="#22d3ee" stroke-width="2"/>
    <path d="M83 112 H94 V128 H106" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>
    <circle cx="83" cy="112" r="4" fill="#22d3ee"/>
    <circle cx="106" cy="128" r="4" fill="#34d399"/>
    <text x="132" y="119" fill="#e5f0f7" font-size="25" font-weight="700">SERVICE DEPENDENCY MAPPER</text>
    <text x="132" y="140" fill="#93a9b8" font-size="14">Vendor-neutral diagnostics for any host, service, port, URL, or certificate</text>
    <rect x="1248" y="91" width="76" height="27" rx="5" fill="#102636"/>
    <text x="1286" y="110" fill="#34d399" font-family="Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle">v1.3.0</text>
    <rect x="1192" y="124" width="132" height="27" rx="5" fill="#102636" stroke="#1e3a4a"/>
    <text x="1258" y="142" fill="#e5f0f7" font-size="11" font-weight="600" text-anchor="middle">Up to date ✓</text>

    <rect x="72" y="166" width="1252" height="112" rx="9" fill="#0d1d2b" stroke="#1e3a4a"/>
    <text x="92" y="191" fill="#e5f0f7" font-size="13" font-weight="700">SERVICE MAP</text>
    <rect x="92" y="204" width="440" height="38" rx="5" fill="#102636" stroke="#1e3a4a"/>
    <text x="108" y="228" fill="#b8cbd7" font-family="Consolas, monospace" font-size="13">C:\monitoring\infrastructure-stack.yaml</text>
    <g font-size="13" font-weight="600" text-anchor="middle">
      <rect x="544" y="204" width="90" height="38" rx="5" fill="#102636" stroke="#1e3a4a"/>
      <text x="589" y="228" fill="#e5f0f7">Browse…</text>
      <rect x="644" y="204" width="110" height="38" rx="5" fill="#102636" stroke="#1e3a4a"/>
      <text x="699" y="228" fill="#e5f0f7">New template</text>
      <rect x="764" y="204" width="170" height="38" rx="5" fill="#102636" stroke="#22d3ee"/>
      <text x="849" y="228" fill="#67e8f9">Discover infrastructure</text>
      <rect x="944" y="204" width="96" height="38" rx="5" fill="#102636" stroke="#1e3a4a"/>
      <text x="992" y="228" fill="#e5f0f7">Validate</text>
      <rect x="1050" y="204" width="254" height="38" rx="5" fill="url(#run)"/>
      <text x="1177" y="228" fill="#07111f">Run analysis</text>
    </g>
    <text x="92" y="261" fill="#93a9b8" font-size="12">Optional overrides     Timeout: 3.0     Workers: 8</text>

    <g>
      <rect x="72" y="294" width="302" height="76" rx="8" fill="#0d1d2b" stroke="#1e3a4a"/>
      <text x="90" y="319" fill="#93a9b8" font-size="11" font-weight="700">OVERALL</text>
      <text x="90" y="350" fill="#fb7185" font-size="22" font-weight="700">DOWN</text>

      <rect x="390" y="294" width="302" height="76" rx="8" fill="#0d1d2b" stroke="#1e3a4a"/>
      <text x="408" y="319" fill="#93a9b8" font-size="11" font-weight="700">ROOT CAUSE</text>
      <text x="408" y="350" fill="#fb7185" font-size="19" font-weight="700">edge_router</text>

      <rect x="708" y="294" width="298" height="76" rx="8" fill="#0d1d2b" stroke="#1e3a4a"/>
      <text x="726" y="319" fill="#93a9b8" font-size="11" font-weight="700">COMPONENTS</text>
      <text x="726" y="350" fill="#34d399" font-size="22" font-weight="700">8</text>

      <rect x="1022" y="294" width="302" height="76" rx="8" fill="#0d1d2b" stroke="#1e3a4a"/>
      <text x="1040" y="319" fill="#93a9b8" font-size="11" font-weight="700">DURATION</text>
      <text x="1040" y="350" fill="#fbbf24" font-size="22" font-weight="700">2.04 s</text>
    </g>

    <rect x="72" y="386" width="1252" height="330" rx="9" fill="#0d1d2b" stroke="#1e3a4a"/>
    <text x="92" y="414" fill="#e5f0f7" font-size="13" font-weight="700">COMPONENT RESULTS</text>
    <rect x="92" y="430" width="1212" height="36" fill="#102636"/>

    <g fill="#b9ccd8" font-size="11" font-weight="700">
      <text x="108" y="453">COMPONENT</text>
      <text x="335" y="453">CHECK</text>
      <text x="425" y="453">TARGET</text>
      <text x="850" y="453">RESULT</text>
      <text x="960" y="453">LATENCY</text>
      <text x="1090" y="453">DIAGNOSIS</text>
    </g>

    <g font-size="13">
      <rect x="92" y="466" width="1212" height="38" fill="#122333"/>
      <text x="108" y="490" fill="#fda4af">Edge router</text>
      <text x="335" y="490" fill="#fda4af">ICMP</text>
      <text x="425" y="490" fill="#fda4af">192.0.2.1</text>
      <text x="850" y="490" fill="#fda4af">DOWN</text>
      <text x="960" y="490" fill="#fda4af">2.01 s</text>
      <text x="1090" y="490" fill="#fda4af" font-weight="700">ROOT CAUSE</text>

      <text x="108" y="528" fill="#fde68a">Public DNS</text>
      <text x="335" y="528" fill="#fde68a">DNS</text>
      <text x="425" y="528" fill="#fde68a">portal.example.com</text>
      <text x="850" y="528" fill="#fde68a">DOWN</text>
      <text x="960" y="528" fill="#fde68a">12.4 ms</text>
      <text x="1090" y="528" fill="#fde68a" font-weight="700">IMPACTED</text>

      <rect x="92" y="542" width="1212" height="38" fill="#0f202f"/>
      <text x="108" y="566" fill="#86efac">VPN gateway</text>
      <text x="335" y="566" fill="#86efac">TCP</text>
      <text x="425" y="566" fill="#86efac">10.10.0.1:443</text>
      <text x="850" y="566" fill="#86efac">UP</text>
      <text x="960" y="566" fill="#86efac">8.9 ms</text>
      <text x="1090" y="566" fill="#86efac" font-weight="700">HEALTHY</text>

      <text x="108" y="604" fill="#86efac">Portal certificate</text>
      <text x="335" y="604" fill="#86efac">TLS</text>
      <text x="425" y="604" fill="#86efac">portal.example.com:443</text>
      <text x="850" y="604" fill="#86efac">UP</text>
      <text x="960" y="604" fill="#86efac">34.1 ms</text>
      <text x="1090" y="604" fill="#86efac" font-weight="700">HEALTHY</text>
    </g>

    <text x="92" y="641" fill="#e5f0f7" font-size="12" font-weight="700">DETAILS</text>
    <rect x="92" y="651" width="1212" height="47" rx="5" fill="#091824"/>
    <text x="108" y="672" fill="#cbdce7" font-family="Consolas, monospace" font-size="11">Message: No successful ICMP reply from 192.0.2.1.</text>
    <text x="108" y="690" fill="#93a9b8" font-family="Consolas, monospace" font-size="11">Critical: yes    Depends on: none    Failed dependencies: none</text>

    <g font-size="12" font-weight="600">
      <rect x="72" y="735" width="124" height="34" rx="5" fill="url(#run)"/>
      <text x="134" y="756" fill="#07111f" text-anchor="middle">View topology</text>
      <rect x="206" y="735" width="108" height="34" rx="5" fill="#102636" stroke="#1e3a4a"/>
      <text x="260" y="756" fill="#e5f0f7" text-anchor="middle">Export JSON</text>
      <rect x="324" y="735" width="132" height="34" rx="5" fill="#102636" stroke="#1e3a4a"/>
      <text x="390" y="756" fill="#e5f0f7" text-anchor="middle">Export Mermaid</text>
      <rect x="466" y="735" width="100" height="34" rx="5" fill="#102636" stroke="#1e3a4a"/>
      <text x="516" y="756" fill="#e5f0f7" text-anchor="middle">Export DOT</text>
    </g>
    <text x="1304" y="756" fill="#93a9b8" font-size="12" text-anchor="end">Analysis complete: DOWN in 2041.20 ms</text>
  </g>
</svg>
