<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Interactive infrastructure topology</title>
  <desc id="desc">A dark network map showing a private subnet, discovered hosts, and generic services connected in dependency layers.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#091824"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#020617" flood-opacity=".55"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#36556a"/>
    </marker>
  </defs>

  <rect width="1400" height="820" rx="26" fill="#020914"/>
  <g filter="url(#shadow)">
    <rect x="38" y="30" width="1324" height="760" rx="18" fill="url(#background)" stroke="#1e3a4a" stroke-width="2"/>
  </g>
  <rect x="38" y="30" width="1324" height="42" rx="18" fill="#0d1d2b"/>
  <circle cx="68" cy="51" r="6" fill="#fb7185"/>
  <circle cx="89" cy="51" r="6" fill="#fbbf24"/>
  <circle cx="110" cy="51" r="6" fill="#34d399"/>
  <text x="700" y="57" fill="#93a9b8" font-family="Segoe UI, Arial" font-size="14" text-anchor="middle">Network topology — Discovered infrastructure</text>

  <g font-family="Segoe UI, Arial">
    <text x="72" y="112" fill="#e5f0f7" font-size="24" font-weight="700">Discovered infrastructure</text>
    <text x="72" y="138" fill="#93a9b8" font-size="13">10 nodes • dependency → component • mouse wheel to zoom</text>

    <g font-size="11" font-weight="700">
      <text x="700" y="123" fill="#22d3ee">● NETWORK</text>
      <text x="796" y="123" fill="#34d399">● HEALTHY</text>
      <text x="886" y="123" fill="#fbbf24">● IMPACTED</text>
      <text x="982" y="123" fill="#fb7185">● ROOT CAUSE</text>
    </g>
    <g font-size="14" font-weight="700" text-anchor="middle">
      <rect x="1168" y="99" width="42" height="34" rx="5" fill="#102636" stroke="#1e3a4a"/>
      <text x="1189" y="121" fill="#e5f0f7">−</text>
      <rect x="1218" y="99" width="42" height="34" rx="5" fill="#102636" stroke="#1e3a4a"/>
      <text x="1239" y="121" fill="#e5f0f7">+</text>
      <rect x="1268" y="99" width="58" height="34" rx="5" fill="#102636" stroke="#1e3a4a"/>
      <text x="1297" y="121" fill="#e5f0f7">Fit</text>
    </g>

    <rect x="72" y="162" width="1254" height="526" rx="9" fill="#081522" stroke="#1e3a4a"/>

    <g fill="none" stroke="#36556a" stroke-width="3" marker-end="url(#arrow)">
      <path d="M700 260 V300 H264 V342"/>
      <path d="M700 260 V300 H584 V342"/>
      <path d="M700 260 V300 H904 V342"/>
      <path d="M700 260 V300 H1224 V342"/>
      <path d="M264 418 V470 H168 V514"/>
      <path d="M264 418 V470 H360 V514"/>
      <path d="M584 418 V470 H552 V514"/>
      <path d="M584 418 V470 H744 V514"/>
      <path d="M904 418 V470 H936 V514"/>
      <path d="M1224 418 V470 H1224 V514"/>
    </g>

    <g>
      <rect x="575" y="190" width="250" height="70" rx="8" fill="#0a2a3a" stroke="#22d3ee" stroke-width="2"/>
      <circle cx="593" cy="209" r="5" fill="#22d3ee"/>
      <text x="607" y="214" fill="#e5f0f7" font-size="15" font-weight="700">Network 192.168.1.0/24</text>
      <text x="592" y="243" fill="#93a9b8" font-family="Consolas, monospace" font-size="12">TOPOLOGY ONLY • Ethernet</text>
    </g>

    <g>
      <rect x="154" y="342" width="220" height="76" rx="8" fill="#102d29" stroke="#34d399" stroke-width="2"/>
      <circle cx="172" cy="361" r="5" fill="#34d399"/>
      <text x="186" y="366" fill="#e5f0f7" font-size="14" font-weight="700">Gateway (192.168.1.1)</text>
      <text x="171" y="398" fill="#93a9b8" font-family="Consolas, monospace" font-size="11">ICMP • gateway</text>

      <rect x="474" y="342" width="220" height="76" rx="8" fill="#102d29" stroke="#34d399" stroke-width="2"/>
      <circle cx="492" cy="361" r="5" fill="#34d399"/>
      <text x="506" y="366" fill="#e5f0f7" font-size="14" font-weight="700">workstation.lan</text>
      <text x="491" y="398" fill="#93a9b8" font-family="Consolas, monospace" font-size="11">ICMP • 192.168.1.20</text>

      <rect x="794" y="342" width="220" height="76" rx="8" fill="#102d29" stroke="#34d399" stroke-width="2"/>
      <circle cx="812" cy="361" r="5" fill="#34d399"/>
      <text x="826" y="366" fill="#e5f0f7" font-size="14" font-weight="700">server.lan</text>
      <text x="811" y="398" fill="#93a9b8" font-family="Consolas, monospace" font-size="11">ICMP • 192.168.1.50</text>

      <rect x="1114" y="342" width="220" height="76" rx="8" fill="#351521" stroke="#fb7185" stroke-width="2"/>
      <circle cx="1132" cy="361" r="5" fill="#fb7185"/>
      <text x="1146" y="366" fill="#e5f0f7" font-size="14" font-weight="700">Host 192.168.1.80</text>
      <text x="1131" y="398" fill="#93a9b8" font-family="Consolas, monospace" font-size="11">TCP • :22</text>
    </g>

    <g>
      <rect x="78" y="514" width="180" height="72" rx="8" fill="#111d2a" stroke="#67e8f9" stroke-width="2"/>
      <text x="96" y="540" fill="#e5f0f7" font-size="14" font-weight="700">HTTP :80</text>
      <text x="96" y="567" fill="#93a9b8" font-family="Consolas, monospace" font-size="11">192.168.1.1:80</text>

      <rect x="270" y="514" width="180" height="72" rx="8" fill="#111d2a" stroke="#67e8f9" stroke-width="2"/>
      <text x="288" y="540" fill="#e5f0f7" font-size="14" font-weight="700">HTTPS :443</text>
      <text x="288" y="567" fill="#93a9b8" font-family="Consolas, monospace" font-size="11">192.168.1.1:443</text>

      <rect x="462" y="514" width="180" height="72" rx="8" fill="#111d2a" stroke="#67e8f9" stroke-width="2"/>
      <text x="480" y="540" fill="#e5f0f7" font-size="14" font-weight="700">SMB :445</text>
      <text x="480" y="567" fill="#93a9b8" font-family="Consolas, monospace" font-size="11">192.168.1.20:445</text>

      <rect x="654" y="514" width="180" height="72" rx="8" fill="#111d2a" stroke="#67e8f9" stroke-width="2"/>
      <text x="672" y="540" fill="#e5f0f7" font-size="14" font-weight="700">RDP :3389</text>
      <text x="672" y="567" fill="#93a9b8" font-family="Consolas, monospace" font-size="11">192.168.1.20:3389</text>

      <rect x="846" y="514" width="180" height="72" rx="8" fill="#111d2a" stroke="#67e8f9" stroke-width="2"/>
      <text x="864" y="540" fill="#e5f0f7" font-size="14" font-weight="700">SSH :22</text>
      <text x="864" y="567" fill="#93a9b8" font-family="Consolas, monospace" font-size="11">192.168.1.50:22</text>

      <rect x="1134" y="514" width="180" height="72" rx="8" fill="#352c12" stroke="#fbbf24" stroke-width="2"/>
      <text x="1152" y="540" fill="#e5f0f7" font-size="14" font-weight="700">SSH :22</text>
      <text x="1152" y="567" fill="#93a9b8" font-family="Consolas, monospace" font-size="11">192.168.1.80:22</text>
    </g>

    <rect x="92" y="620" width="1214" height="48" rx="5" fill="#091824"/>
    <text x="108" y="641" fill="#cbdce7" font-family="Consolas, monospace" font-size="11">server.lan (host_192_168_1_50)  |  Target: 192.168.1.50  |  Status: UP / HEALTHY</text>
    <text x="108" y="659" fill="#93a9b8" font-family="Consolas, monospace" font-size="11">Depends on: network_192_168_1_0_24  |  Tags: discovered, host, ip:192.168.1.50</text>

    <rect x="72" y="714" width="1254" height="44" rx="7" fill="#0d1d2b" stroke="#1e3a4a"/>
    <rect x="90" y="727" width="180" height="18" rx="9" fill="#102636"/>
    <rect x="90" y="727" width="146" height="18" rx="9" fill="url(#accent)"/>
    <text x="1298" y="741" fill="#93a9b8" font-size="12" text-anchor="end">Topology generated from connected private IPv4 networks</text>
  </g>
</svg>
