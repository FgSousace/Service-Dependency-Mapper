version: 1

service:
  name: Example monitoring stack
  description: Replace the lab addresses before running this example.

defaults:
  timeout: 3
  workers: 8

components:
  - id: monitoring_dns
    name: Monitoring DNS
    check:
      type: dns
      target: zabbix.lab.local
    tags: [network, dns]

  - id: zabbix_server
    name: Zabbix server
    depends_on: [monitoring_dns]
    check:
      type: tcp
      host: zabbix.lab.local
      port: 10051
    tags: [monitoring, backend]

  - id: web_tls
    name: Zabbix web TLS
    depends_on: [monitoring_dns]
    check:
      type: tcp
      host: zabbix.lab.local
      port: 443
    tags: [monitoring, frontend]

  - id: web_ui
    name: Zabbix web UI
    depends_on: [web_tls, zabbix_server]
    check:
      type: http
      url: https://zabbix.lab.local/
      expected_status: [200]
      contains: Zabbix
    tags: [monitoring, frontend]

  - id: windows_agent
    name: Windows agent
    critical: false
    depends_on: [zabbix_server]
    check:
      type: tcp
      host: 192.168.1.20
      port: 10050
    tags: [monitoring, agent]

