[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "service-dependency-mapper"
version = "1.6.0"
description = "Discover infrastructure, visualize dependencies, and identify root-cause candidates."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Maciej Owczarek" },
]
keywords = [
  "noc",
  "monitoring",
  "dependency-map",
  "network-discovery",
  "network-topology",
  "root-cause-analysis",
  "networking",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Monitoring",
]
dependencies = [
  "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.9,<1.0",
]

[project.scripts]
sdmap = "service_dependency_mapper.cli:main"
sdmap-gui = "service_dependency_mapper.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["service_dependency_mapper"]
